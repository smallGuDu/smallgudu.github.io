<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>网易云音乐下载器 · 歌单 / 单曲</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 28px 32px 32px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; color: #1d1d1f; }
    .subtitle { font-size: 13px; color: #86868b; margin-bottom: 22px; }
    .input-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .input-row input[type="text"] {
      flex: 1; min-width: 220px; padding: 10px 14px;
      border: 1px solid #d2d2d7; border-radius: 10px;
      font-size: 14px; outline: none; transition: border-color .2s;
    }
    .input-row input[type="text"]:focus { border-color: #0071e3; }
    .input-row select {
      padding: 10px 12px; border: 1px solid #d2d2d7;
      border-radius: 10px; font-size: 14px; background: #fff;
      outline: none; cursor: pointer;
    }
    .btn {
      padding: 10px 20px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 500; cursor: pointer;
      transition: background .2s, opacity .2s; white-space: nowrap;
    }
    .btn-primary { background: #0071e3; color: #fff; }
    .btn-primary:hover { background: #0077ed; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
    .btn-secondary:hover { background: #dddde2; }
    .btn-small { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
    .btn-download { background: #34c759; color: #fff; }
    .btn-download:hover { background: #30b753; }
    .btn-download:disabled { opacity: .6; cursor: not-allowed; }

    .status { margin: 14px 0 0; font-size: 13px; color: #86868b; min-height: 18px; line-height: 1.6; }
    .status.error { color: #ff3b30; }
    .status.success { color: #34c759; }
    .status a { color: #0071e3; text-decoration: underline; }

    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px; margin: 20px 0 10px;
      padding-bottom: 10px; border-bottom: 1px solid #e8e8ed;
    }
    .toolbar-left { display: flex; align-items: center; gap: 16px; font-size: 13px; color: #1d1d1f; }
    .toolbar-left label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .toolbar-left input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0071e3; cursor: pointer; }
    .count { color: #86868b; }

    .song-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .song-table th {
      text-align: left; padding: 8px 10px; font-weight: 500;
      color: #86868b; font-size: 12px; text-transform: uppercase;
      letter-spacing: .04em; border-bottom: 1px solid #e8e8ed;
    }
    .song-table td { padding: 10px; border-bottom: 1px solid #f2f2f7; vertical-align: middle; }
    .song-table tr:last-child td { border-bottom: none; }
    .song-table tr:hover td { background: #fafafa; }
    .song-table .col-check { width: 36px; }
    .song-table .col-index { width: 40px; color: #86868b; font-size: 13px; }
    .song-table .col-name { font-weight: 500; color: #1d1d1f; }
    .song-table .col-artist { color: #86868b; font-size: 13px; }
    .song-table .col-action { width: 90px; text-align: right; }
    .empty-state { text-align: center; padding: 40px 0; color: #86868b; font-size: 14px; }

    .notice {
      margin-top: 16px; padding: 12px 14px; background: #fff8e1;
      border-radius: 10px; font-size: 12px; color: #8a6d00; line-height: 1.6;
    }
    .notice strong { color: #6b5300; }

    @media (max-width: 600px) {
      body { padding: 12px; }
      .container { padding: 20px 16px; }
      .input-row input[type="text"] { min-width: 100%; }
      .song-table .col-artist { display: none; }
    }
  </style>
</head>
<body>
<div class="container">
  <h1>🎵 网易云音乐下载器</h1>
  <p class="subtitle">粘贴歌单 / 歌曲 ID 或链接，解析后即可下载。支持一键下载整张歌单。</p>

  <div class="input-row">
    <input type="text" id="input" placeholder="歌单ID / 歌曲ID / 粘贴链接" />
    <select id="type">
      <option value="playlist">歌单</option>
      <option value="song">单曲</option>
    </select>
    <button class="btn btn-primary" id="parseBtn">解析</button>
  </div>
  <div class="status" id="status"></div>

  <div id="resultArea" style="display:none;">
    <div class="toolbar">
      <div class="toolbar-left">
        <label><input type="checkbox" id="selectAll" checked /> 全选</label>
        <span class="count" id="countLabel"></span>
      </div>
      <div style="display:flex; gap:8px;">
